services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jabazi
      POSTGRES_USER: jabazi
      POSTGRES_PASSWORD: jabazi
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["jabazi_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabazi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jabazi_postgres:
