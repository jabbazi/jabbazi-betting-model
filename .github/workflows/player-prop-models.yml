name: Fit NFL and MLB player prop models

on:
  workflow_dispatch:
  push:
    branches: [upgrade/player-props-20260925, build/production-foundations]
    paths:
      - '.github/workflows/player-prop-models.yml'
      - 'docs/experiments/nfl-player-props/request.json'
      - 'tools/capture_nfl_player_props.py'
      - 'tools/capture_mlb_history.py'
      - 'tools/build_mlb_prop_datasets.py'
      - 'tools/train_player_prop_models.py'
      - 'src/jabazi/models/player_distribution.py'
      - 'src/jabazi/models/train_player_props.py'
      - 'src/jabazi/research/prop_data.py'

permissions:
  contents: write

concurrency:
  group: player-prop-model-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install '.[research]'
      - name: Capture NFL weekly player data
        run: |
          rm -rf /tmp/nfl-player-capture
          python tools/capture_nfl_player_props.py \
            --request docs/experiments/nfl-player-props/request.json \
            --output /tmp/nfl-player-capture
        env:
          PYTHONPATH: src:.
      - name: Fit NFL prop distributions
        run: |
          rm -rf /tmp/nfl-models
          python tools/train_player_prop_models.py \
            --input-dir /tmp/nfl-player-capture \
            --output-dir /tmp/nfl-models \
            --train-before 2025-01-01T00:00:00+00:00 \
            --test-before 2026-01-01T00:00:00+00:00
        env:
          PYTHONPATH: src:.
      - name: Capture Retrosheet MLB batter and pitcher history
        run: |
          rm -rf /tmp/mlb-capture
          python tools/capture_mlb_history.py \
            --request docs/experiments/mlb-history-capture/request.json \
            --output /tmp/mlb-capture
        env:
          PYTHONPATH: src:.
      - name: Build MLB prop datasets
        run: |
          rm -rf /tmp/mlb-prop-data
          python tools/build_mlb_prop_datasets.py \
            --pitching /tmp/mlb-capture/pitching-staging.jsonl.gz \
            --batting /tmp/mlb-capture/batting-staging.jsonl.gz \
            --receipts /tmp/mlb-capture/receipts.json \
            --output /tmp/mlb-prop-data
        env:
          PYTHONPATH: src:.
      - name: Fit MLB prop distributions
        run: |
          rm -rf /tmp/mlb-models
          python tools/train_player_prop_models.py \
            --input-dir /tmp/mlb-prop-data \
            --output-dir /tmp/mlb-models \
            --train-before 2024-01-01T00:00:00+00:00 \
            --test-before 2025-01-01T00:00:00+00:00
        env:
          PYTHONPATH: src:.
      - name: Install generated artifacts
        run: |
          rm -rf models/player_props
          mkdir -p models/player_props
          cp -R /tmp/nfl-models/americanfootball_nfl models/player_props/
          cp -R /tmp/mlb-models/baseball_mlb models/player_props/
          cp /tmp/nfl-models/training-report.json models/player_props/nfl-training-report.json
          cp /tmp/mlb-models/training-report.json models/player_props/mlb-training-report.json
      - name: Verify generated artifacts are research-gated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          artifacts = [p for p in Path('models/player_props').rglob('*.json') if 'report' not in p.name]
          assert artifacts, 'No player artifacts generated'
          for path in artifacts:
              payload=json.loads(path.read_text())
              assert payload['stage'] in {'SHADOW_ONLY','VALIDATING','LIMITED_LIVE','PRODUCTION_APPROVED'}
              if payload['stage']=='PRODUCTION_APPROVED':
                  assert payload['validation']['promotion_passed'] is True
              else:
                  assert payload['validation'].get('promotion_passed') is not True
          print(f'verified_artifacts={len(artifacts)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: player-prop-model-artifacts
          path: |
            models/player_props/
            /tmp/nfl-player-capture/report.json
            /tmp/mlb-prop-data/report.json
          retention-days: 90
      - name: Commit model artifacts
        run: |
          if git diff --quiet -- models/player_props; then
            echo "No model artifact changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/player_props
          git commit -m "models: refresh NFL and MLB player prop distributions"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
