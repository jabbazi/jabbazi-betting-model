name: VIP repair verified follow-through objects
on:
  push:
    branches: [feature/vip-discord-research-repair]
    paths: [.github/workflows/vip-repair-followthrough-blobs.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jabbazi/jabbazi-betting-model' && github.ref == 'refs/heads/feature/vip-discord-research-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact tested changes and store unreferenced blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          changes = json.loads(r'''{"docs/VIP_RESEARCH_REPAIR.md":{"before":"557a7f2a700a677c1e8ba85bea0f3f196d0d1af04f1a5c7bece9f2df4ee20906","after":"9804c0c924683ad32711581519f93478d1cb10af219d573ac0aef7be96abdbbc","edits":[[5563,5563,"\n\n## Follow-through fixes (November 3, 2026)\n\nThe first hosted run of this repair failed the authenticated browser's existing\nJudge HR alias-search journey. The application had incorrectly restricted global\nsearch to the selected sport (NBA by default), hiding saved MLB results. Global\nsearch now means all sports until a sport is explicitly chosen; the selector,\nfilters and pagination preserve that distinction. The test is retained.\n\nPrivate Discord links now include the summary's exact Chicago slate date. The\napp honors a valid current/next-day date, clears that override when the user changes\nthe selector, and refuses to silently replace an expired dated link with a new\nslate. Long Discord summaries expose the next command page.\n\nSaved paid rows now retain separate identities for different sportsbooks' actual\nquotes of the same player, market, side and line. Book filters/detail prices remain\nconsistent while Top 10 still deduplicates repeated player/market selections.\nOrdinary pre-existing row IDs are not rewritten.\n\nService failures display a recoverable generic message, not raw 5xx diagnostics.\nNo authentication, feature-freshness, quote-freshness, quarantine, model-stage or\npost-to-Discord gate was relaxed. No provider collection is triggered by a view.\n\nLocal follow-through verification: 1,438 Python tests and three subtests passed;\n29 focused repair cases passed; 13 actual-asset/ASGI Chromium research journeys\npassed with zero page errors. Hosted HTTPS/container/final-commit checks must be\nverified separately; these local counts are not production acceptance.\n"]]},"src/jabazi/discord_bot.py":{"before":"27bdd6a666e2395f2a1e2ca59a2abd7fb89447544a07f6df39b3dd5b92f3f984","after":"992856fddd11df866a5eae783ec3110e124e854326d2166d8872aa7f08c42a1c","edits":[[31248,31248,"                        link += \"&\" + urlencode({\"date\": saved[\"slate_date\"]})\n"]]},"src/jabazi/discord_research_views.py":{"before":"57d0de68ca4494e908a580f54ab40380f5d76b62fc10c546a6e381d5d15eaac4","after":"791c049d5d1f715890519faa9ebec5310bda0d4c117825053f638b2b28057e66","edits":[[4103,4103,"    if result['next'] is not None:\n        description += f'\\nNext page: /{view} sport:{sport} page:{page+1}' + (f' market:{safe(market, 80)}' if market else '')\n"],[4777,4777,"slate_date': day.isoformat(), '"]]},"src/jabazi/static/terminal.js":{"before":"f4e7fdb82a0a137c8a46c3bf20974b5d2834484fdaf29644cb136c44daefe2cf","after":"4f089a4d973e81582708cb85906efac9a3f3e2a48acc570e9ea2302c4123a8ef","edits":[[1620,1620,"function routeScope(){const parts=location.hash.slice(1).split('&');return {route:parts.shift().split('=')[0],query:new URLSearchParams(parts.join('&'))};}\nfunction clearExplicitDate(){const parts=location.hash.slice(1).split('&'),route=parts.shift(),q=new URLSearchParams(parts.join('&'));q.delete('date');q.delete('offset');history.replaceState(null,'','#'+route+(q.size?'&'+q:''));}\nfunction applyExplicitDate(params){\n  if(!params.has('date'))return true;\n  const value=params.get('date'),today=chicagoDate(),tomorrow=new Date(Date.parse(today+'T12:00:00Z')+86400000).toISOString().slice(0,10);\n  if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)||![today,tomorrow].includes(value))return false;\n  slateMode=value===today?'today':'tomorrow';rememberScope();return true;\n}\n"],[1717,1786," scope=routeScope(),searching=scope.route==='search',globalSearch=searching&&!scope.query.get('sport');\n  const[sl,sp]=select('Sport',[...(searching?[['','All sports']]:[]),...['NBA','NFL','NHL','MLB','CFB'].map(v=>[v,v])],globalSearch?'':"],[1888,1888,"if(sp.value)"],[2050,2232,"if(sp.value)q.set('sport',sp.value);else q.delete('sport');for(const k of ['event_id','market','player','team','offset'])q.delete(k);\n    const next=['home','top10','rankings','moneylines','props','board','sheets','search"],[2550,2632,"clearExplicitDate();rememberScope();render();});\n  panel.append(sl,l,node('p','Viewing '+(globalSearch?'all sports':selectedSport)"],[5546,5581,"r.status<500&&typeof d.detail==='string'?d.detail.slice(0,300)"],[21134,21134,"if(!applyExplicitDate(params)){++serial;page('Dated research link');$('content').replaceChildren(empty('This dated research link is no longer current','The requested date is not today or tomorrow in America/Chicago. Open the current slate; no different date was substituted.'));const current=node('button','Open current slate','primary');current.addEventListener('click',()=>{slateMode='auto';clearExplicitDate();rememberScope();render();});$('content').append(current);$('refresh').disabled=false;return;}renderedDate=slateKey();"],[41766,41905,"(route==='search'?'':selectedSport),query=new URLSearchParams(params);\n  if(sport)query.set('sport',sport);else query.delete('sport');\n  const d=await get('board?'+query);build=researchBoard(d,route"],[70267,70267,",'date'"]]},"src/jabazi/vip/research.py":{"before":"b1cfe0ccf707b1a806fc2d59d373c28875541a0d641bbd5e989fd7498d298d20","after":"930779a874429d6f6d3722e461e767e8cdb5c3798c6dcb1d7f9ae3a9d14a906d","edits":[[6005,6016,"# Preserve sportsbook-specific records. The same player/line can\n                    # have several actual quotes; collapsing them loses book filters.\n                    # Ordinary-board identities are unchanged for existing watchlists.\n                    from ..persistence.store import digest\n                    row.update(id=digest([row['id'], str(row.get('book') or '').casefold()])[:32],\n                               "]]},"tests/test_vip_research_repair.py":{"before":"40125b10fad5f08ee97366e0d918f0f9bdddaa7c77514bc4b0004bdd26a6a8ec","after":"6b7e7f23c7d494e473a384cbefc5edf5b6584e314b04171c5b0515c29a4d5c21","edits":[[15265,15265,"            assert '&date=' in sent.args[0]\n            assert sent.kwargs['embed'].description.split(' · ')[0] in sent.args[0]\n"],[16178,16178,"\n\ndef test_same_player_line_at_two_books_remains_browsable(portal):\n    store, client = portal\n    row = paid(store, count=0)\n    paid(store, rows=[{**row, 'best_sportsbook': 'Fixture A', 'best_decimal': 1.80},\n                      {**row, 'best_sportsbook': 'Fixture B', 'best_decimal': 1.95}])\n    sign_in(store, client)\n    all_rows = client.get('/v1/vip/board?family=props&sport=NHL').json()['rows']\n    assert len(all_rows) == 2\n    assert len({r['id'] for r in all_rows}) == 2\n    for row in all_rows:\n        detail = client.get('/v1/vip/detail/' + row['id']).json()['row']\n        assert detail['book'] == row['book'] and detail['decimal'] == row['decimal']\n    filtered = client.get('/v1/vip/board?family=props&sport=NHL&book=Fixture%20B').json()\n    assert filtered['total'] == 1 and filtered['rows'][0]['book'] == 'Fixture B'\n    # A ranked summary is still one player/stat, not two artificial opportunities.\n    ranked = client.get('/v1/vip/rankings?sport=NHL').json()['player_markets']['player_shots_on_goal']\n    assert len(ranked) == 1\n\n\ndef test_global_alias_search_keeps_cross_sport_results(portal):\n    store, client = portal\n    row = ordinary(store)\n    ordinary(store, rows=[row, {**row, 'sport': 'baseball_mlb', 'event_id': 'mlb-1',\n              'participant': 'Fixture Judge', 'market': 'batter_home_runs',\n              'selection': 'Over', 'line': '.5'}])\n    sign_in(store, client)\n    result = client.get('/v1/vip/board?q=Judge%20HR').json()\n    assert result['total'] == 1 and result['rows'][0]['sport'] == 'MLB'\n    assert client.get('/v1/vip/board?q=Judge%20HR&sport=NBA').json()['total'] == 0\n\n\ndef test_discord_page_has_explicit_matching_slate_date(portal):\n    store, _ = portal\n    paid(store, count=12)\n    report = summary(store, view='props', sport='NHL')\n    assert report['slate_date'] in report['embed']['description']\n    assert report['next_page'] == 2\n    assert '/props sport:NHL page:2' in report['embed']['description']\n"]]},"tests/vip_repair_browser.py":{"before":"e84d3cb4bcea64a285ae6b9daecdb1da344a64afc1f2408011ee24e6c99136e0","after":"50d5eb99a95cb8e58ae102d58cd804f125e6facf794ade141ea7806a3520fdff","edits":[[1681,1712,"PRIVATE_SERVICE_DIAGNOSTIC"],[5661,5661,", full_page=True"],[7734,7734,"        route('props&sport=NHL&date=2026-11-03', '61 matching rows')\n        assert page.get_by_role('combobox', name='Slate date').input_value() == 'today'\n        assert requests[-1].endswith('slate_date=2026-11-03')\n        page.get_by_role('combobox', name='Slate date').select_option('tomorrow')\n        page.get_by_text('2026-11-04', exact=False).first.wait_for()\n        assert 'date=' not in page.url\n        assert page.locator('.opportunity').count() == 0\n        flows.append('dated Discord research link uses its date; manual date changes do not stick')\n        count_before = len(requests)\n        route('props&sport=NHL&date=2025-01-01', 'This dated research link is no longer current')\n        assert len(requests) == count_before\n        page.get_by_role('button', name='Open current slate').click()\n        page.wait_for_function(\"document.querySelectorAll('.opportunity').length===50\")\n        flows.append('expired dated links never substitute a different slate silently')\n        route('search&q=Skater', '61 matching rows')\n        assert page.get_by_role('combobox', name='Research sport').input_value() == ''\n        assert 'Viewing all sports' in page.locator('#content').inner_text()\n        page.get_by_role('combobox', name='Research sport').select_option('NBA')\n        page.get_by_text('No records match these filters', exact=False).first.wait_for()\n        page.get_by_role('combobox', name='Research sport').select_option('')\n        page.wait_for_function(\"document.querySelectorAll('.opportunity').length===50\")\n        page.get_by_role('link', name='Next 50 →').first.click()\n        page.wait_for_function(\"document.querySelectorAll('.opportunity').length===11\")\n        assert 'search&' in page.url\n        flows.append('global search crosses sports and retains full-board pagination')\n\n"],[7979,7979,"        assert 'PRIVATE_SERVICE_DIAGNOSTIC' not in page.locator('#content').inner_text()\n"]]},"tests/vip_scenarios.test.cjs":{"before":"eaf3a171c6999ce0040a4b15c9a0f4fb2a7ccd8d18dfe37fa24a0dc10fb91eb4","after":"04ee55e3be99fd45695e7c27f293a1dbcb9fd813ce5ae1404ce44128827be664","edits":[[276,276,",...(process.env.CHROMIUM_PATH?{executablePath:process.env.CHROMIUM_PATH}:{})"]]},"tests/vip_ui_test.cjs":{"before":"fa82c19b14d659516914404b71aa3bdc2fcd756cd54a791fcbb1e3b537c5cf98","after":"027160b25fd365f1d8bdda70ce602da48b45cfd81f33482004941610b2a252de","edits":[[124,124,",...(process.env.CHROMIUM_PATH?{executablePath:process.env.CHROMIUM_PATH}:{})"]]}}''')
          allowed = {'docs/VIP_RESEARCH_REPAIR.md','src/jabazi/discord_bot.py','src/jabazi/discord_research_views.py','src/jabazi/static/terminal.js','src/jabazi/vip/research.py','tests/test_vip_research_repair.py','tests/vip_repair_browser.py','tests/vip_scenarios.test.cjs','tests/vip_ui_test.cjs'}
          assert set(changes) == allowed
          prepared = {}
          for name, entry in changes.items():
              path = Path(name)
              assert path.is_file() and not path.is_symlink()
              text = path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest() == entry['before'], name
              edits = entry['edits']
              assert all(0 <= a <= b <= len(text) for a,b,_ in edits)
              assert all(edits[i][1] <= edits[i+1][0] for i in range(len(edits)-1))
              for start,end,replacement in reversed(edits):
                  text = text[:start] + replacement + text[end:]
              assert hashlib.sha256(text.encode()).hexdigest() == entry['after'], name
              prepared[name] = text
          results = {}
          for name, text in prepared.items():
              request = urllib.request.Request('https://api.github.com/repos/jabbazi/jabbazi-betting-model/git/blobs',data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              results[name] = {'sha':blob['sha'],'sha256':changes[name]['after']}
          Path('/tmp/vip-followthrough-blobs.json').write_text(json.dumps({'base':os.environ['GITHUB_SHA'],'files':results},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: vip-followthrough-reviewed-blobs
          path: /tmp/vip-followthrough-blobs.json
          retention-days: 1
