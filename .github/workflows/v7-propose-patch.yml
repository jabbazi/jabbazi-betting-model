name: V7 verified development commit proposal
on:
  push:
    branches: [feature/scanner-player-probability-research-board]
    paths: [.github/workflows/v7-propose-patch.yml]
permissions:
  contents: write
jobs:
  propose:
    if: github.repository == 'jabbazi/jabbazi-betting-model' && github.ref == 'refs/heads/feature/scanner-player-probability-research-board'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact source hashes and construct unreferenced development commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import urllib.request

          repo = 'jabbazi/jabbazi-betting-model'
          branch = 'refs/heads/feature/scanner-player-probability-research-board'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == branch
          parent = os.environ['GITHUB_SHA']
          compressed_sha = 'a0c81b657a664b428cbdedbadc7dc8abef3b76a4dff06b077c417fe6bd37ff3e'
          patch_sha = '4bc2725887a9a593e1585dc9c0b262e95ea26cf0c7424745c02d09fec849ac83'
          parts = [Path(f'.github/v7-draft-patch/part{i}.b64') for i in range(4)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) == 38192
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == compressed_sha
          decoder = lzma.LZMADecompressor(memlimit=100_000_000)
          decoded = decoder.decompress(compressed, max_length=1_000_000)
          assert decoder.eof and not decoder.unused_data
          bundle = json.loads(decoded)
          patch = bundle['patch'].encode('utf-8')
          assert bundle['patch_sha256'] == patch_sha
          assert hashlib.sha256(patch).hexdigest() == patch_sha
          files = bundle['files']
          assert len(files) == 25
          root = Path.cwd().resolve()
          for name, hashes in files.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('src/jabazi/', 'tests/', 'tools/', 'docs/'))
              local = Path(name)
              assert local.resolve().is_relative_to(root)
              assert not local.is_symlink()
              before = hashes['before']
              if before is None:
                  assert not local.exists(), f'Unexpected existing file: {name}'
              else:
                  assert local.is_file(), f'Missing base file: {name}'
                  assert hashlib.sha256(local.read_bytes()).hexdigest() == before, f'Base changed: {name}'
          patch_file = Path('/tmp/v7-implementation.patch')
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '--index', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', str(patch_file)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert set(filter(None, changed)) == set(files)
          for name, hashes in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == hashes['after'], f'Output changed: {name}'
          subprocess.run(['python', '-m', 'compileall', '-q', 'src', 'tools', 'tests'], check=True)
          subprocess.run(['node', '--check', 'src/jabazi/static/terminal.js'], check=True)

          def api(method, endpoint, value=None):
              payload = None if value is None else json.dumps(value).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + endpoint,
                  data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          base_tree = api('GET', '/git/commits/' + parent)['tree']['sha']
          entries = []
          for name in sorted(files):
              blob = api('POST', '/git/blobs', {'content': Path(name).read_text(), 'encoding': 'utf-8'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          cleanup = [str(p) for p in parts] + [
              '.github/workflows/v7-source-audit.yml',
              '.github/workflows/v7-propose-patch.yml']
          for name in cleanup:
              assert Path(name).is_file()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'V7: integrate bounded paid NBA NFL NHL research into full scanner\n\nReuse PR80 and PR83; add exact-line model joins, immutable forecast evidence, per-market Top10 and explicit partial coverage. Preserve betting and deployment gates. Remove temporary source transport files. No production deployment.',
              'tree': tree['sha'], 'parents': [parent]})
          output = Path('/tmp/v7-proposal')
          output.mkdir()
          (output / 'proposal.json').write_text(json.dumps({
              'parent_sha': parent, 'commit_sha': commit['sha'], 'tree_sha': tree['sha'],
              'patch_sha256': patch_sha, 'compressed_sha256': compressed_sha,
              'changed_files': files, 'cleanup_paths': cleanup,
              'branch_updated': False, 'production_deployed': False,
              'tests': 'Compile and JavaScript syntax only; full CI and live acceptance remain required.'}, indent=2))
          print('Proposed development commit object:', commit['sha'])
          print('No branch refs were updated; no production deployment or model promotion occurred.')
      - uses: actions/upload-artifact@v4
        with:
          name: v7-proposed-development-commit
          path: /tmp/v7-proposal/proposal.json
          retention-days: 1
          if-no-files-found: error
