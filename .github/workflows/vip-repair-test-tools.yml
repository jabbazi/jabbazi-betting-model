name: VIP repair offline test tools
on:
  push:
    branches: [feature/vip-discord-research-repair]
    paths: [.github/workflows/vip-repair-test-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir -p source
          git archive HEAD | gzip > source/repository.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vip-repair-complete-fixtures
          path: source
          retention-days: 1
