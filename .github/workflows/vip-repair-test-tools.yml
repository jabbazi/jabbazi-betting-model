name: VIP repair offline test tools
on:
  push:
    branches: [feature/vip-discord-research-repair]
    paths: [.github/workflows/vip-repair-test-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps --dest wheels 'time-machine<3,>=2.16' 'discord.py<3,>=2.4' 'ruff<1,>=0.9' 'psycopg<4,>=3.2' 'psycopg-binary<4,>=3.2' 'mcp==2.2.0' 'mcp-types==2.2.0' httpx2 httpcore2 sse-starlette pyjwt truststore
      - uses: actions/upload-artifact@v4
        with:
          name: vip-repair-offline-wheels
          path: wheels
          retention-days: 1
