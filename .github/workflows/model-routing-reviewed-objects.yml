name: Prepare reviewed model routing objects
on:
  push:
    branches: [fix/all-model-app-routing]
    paths: [.github/workflows/model-routing-reviewed-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'jabbazi/jabbazi-betting-model' && github.ref == 'refs/heads/fix/all-model-app-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7dc640132563c6717c3926b21972bc85bba36685
          persist-credentials: false
      - name: Verify exact reviewed sources and store unreferenced blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request, zlib
          from pathlib import Path
          packed = (
          ''
          ''
          )
          raw = zlib.decompress(base64.b64decode(packed))
          assert hashlib.sha256(raw).hexdigest() == '6b0765df1a37a373f682c413fe7cfe2e51f134bbc8a5b47abd87cfe56898f556'
          changes = json.loads(raw)
          allowed = {'docs/MODEL_APP_ROUTING_FOLLOWUP.md','docs/vip_display_release_boundary.json','src/jabazi/api.py','src/jabazi/chatgpt_api.py','src/jabazi/discord_research_views.py','src/jabazi/discord_sheets.py','src/jabazi/models/nhl_goals.py','src/jabazi/models/player_distribution.py','src/jabazi/player_probability_board.py','src/jabazi/reliability/layer.py','src/jabazi/static/terminal.js','src/jabazi/vip/api.py','src/jabazi/vip/data.py','src/jabazi/vip/model_diagnostics.py','src/jabazi/vip/model_routing.py','src/jabazi/vip/research.py','tests/test_chatgpt_api.py','tests/test_model_app_routing.py','tests/test_vip_display_release_boundary.py','tests/vip_repair_browser.py'}
          assert set(changes) == allowed
          sources = {}
          for name, entry in changes.items():
              path = Path(name)
              assert not path.is_symlink()
              if entry['before'] is None:
                  assert not path.exists(), name
                  text = ''
              else:
                  text = path.read_text()
                  assert hashlib.sha256(text.encode()).hexdigest() == entry['before'], name
              edits = entry['edits']
              assert all(0 <= a <= b <= len(text) for a,b,_ in edits)
              assert all(edits[i][1] <= edits[i+1][0] for i in range(len(edits)-1))
              for start, end, replacement in reversed(edits):
                  text = text[:start] + replacement + text[end:]
              assert hashlib.sha256(text.encode()).hexdigest() == entry['after'], name
              sources[name] = text
          results = {}
          for name, text in sources.items():
              request = urllib.request.Request('https://api.github.com/repos/jabbazi/jabbazi-betting-model/git/blobs', data=json.dumps({'content':text,'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  results[name] = {'sha':json.load(response)['sha'],'sha256':changes[name]['after']}
          Path('/tmp/model-routing-reviewed-blobs.json').write_text(json.dumps({'base':'7dc640132563c6717c3926b21972bc85bba36685','files':results},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: model-routing-reviewed-blobs
          path: /tmp/model-routing-reviewed-blobs.json
          retention-days: 1
