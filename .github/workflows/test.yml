name: Research platform verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jabbazi_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: jabbazi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jabbazi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JABBAZI_TEST_POSTGRES_URL: postgresql+psycopg://jabbazi_test:ci_ephemeral_only@localhost:5432/jabbazi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,discord,research]'
      - run: ruff check src tools tests --select F
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python tools/smoke_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jabbazi-research:test .
      - run: docker run --rm jabbazi-research:test python -m jabazi --help
      - run: docker compose -f docker-compose.ci.yml up -d --wait api worker
      - run: python tools/smoke_stack.py
        env:
          JABBAZI_STACK_TEST_MODE: "1"
          JABBAZI_STACK_TEST_TOKEN: ci-only-service-token-at-least-32-characters
      - name: Verify disposable database backup and restore
        run: |
          docker compose -f docker-compose.ci.yml exec -T db pg_dump -U ci -d jabbazi_ci -Fc > /tmp/jabbazi-ci-backup.dump
          docker compose -f docker-compose.ci.yml exec -T db createdb -U ci jabbazi_restore
          docker compose -f docker-compose.ci.yml exec -T db pg_restore -U ci -d jabbazi_restore < /tmp/jabbazi-ci-backup.dump
          python tools/verify_ci_restore.py
      - run: docker compose -f docker-compose.ci.yml stop db
      - run: python tools/smoke_stack.py
        env:
          JABBAZI_STACK_TEST_MODE: "1"
          JABBAZI_STACK_TEST_TOKEN: ci-only-service-token-at-least-32-characters
          JABBAZI_STACK_EXPECT_OUTAGE: "1"
      - if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  vip-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,discord,research]'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start isolated HTTPS fixture
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/vip-staging.key -out /tmp/vip-staging.crt -days 1 -subj '/CN=localhost'
          PYTHONPATH=src python tests/vip_staging_server.py > /tmp/vip-staging.log 2>&1 &
          for attempt in $(seq 1 30); do curl -kfsS https://127.0.0.1:8765/vip > /dev/null && break; sleep 1; done
      - run: node tests/vip_ui_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vip-browser-evidence
          path: |
            /tmp/jabbazi-vip-*.png
            /tmp/vip-staging.log
