name: Research platform verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jabbazi_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: jabbazi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jabbazi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JABBAZI_TEST_POSTGRES_URL: postgresql+psycopg://jabbazi_test:ci_ephemeral_only@localhost:5432/jabbazi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tools tests --select F
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python tools/smoke_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jabbazi-research:test .
      - run: docker run --rm jabbazi-research:test python -m jabazi --help
