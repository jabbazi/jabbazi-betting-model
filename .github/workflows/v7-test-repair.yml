name: V7 test assertion repair proposal
on:
  push:
    branches: [feature/scanner-player-probability-research-board]
    paths: [.github/workflows/v7-test-repair.yml]
permissions:
  contents: write
jobs:
  propose:
    if: github.repository == 'jabbazi/jabbazi-betting-model' && github.ref == 'refs/heads/feature/scanner-player-probability-research-board'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed test-only delta and create unreferenced commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path
          encoded = ''
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '0bd34a243f4c3597c8796a20a0410774efdd9250596d18f472b076757f9831f3'
          bundle = json.loads(lzma.decompress(compressed, memlimit=100_000_000))
          files = bundle['files']
          assert set(files) == {'tests/test_boost_roster_api.py', 'tests/test_score_models.py', 'tests/test_verify_goat_exact_line_inference.py'}
          for path, hashes in files.items():
              assert not Path(path).is_symlink()
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == hashes['before']
          Path('/tmp/repair.patch').write_text(bundle['patch'])
          subprocess.run(['git', 'apply', '--check', '--index', '/tmp/repair.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/repair.patch'], check=True)
          for path, hashes in files.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == hashes['after']
          parent = os.environ['GITHUB_SHA']
          repo = 'jabbazi/jabbazi-betting-model'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/feature/scanner-player-probability-research-board'
          def api(method, endpoint, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint,
                  data=None if payload is None else json.dumps(payload).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json',
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in sorted(files):
              blob = api('POST', '/git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/v7-test-repair.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', '/git/trees', {'base_tree': api('GET', '/git/commits/' + parent)['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {'message': 'V7 regression: assert partial paid coverage, NHL support and structural redaction\n\nPreserve all model/auth/payment gates. Keep valid team results while missing paid credentials mark full scans PARTIAL. Test unsupported WNBA instead of now-supported NHL. Avoid false identity leak matches in timestamp microseconds.', 'tree': tree['sha'], 'parents': [parent]})
          out = Path('/tmp/v7-test-repair'); out.mkdir()
          (out/'proposal.json').write_text(json.dumps({'parent_sha': parent, 'commit_sha': commit['sha'], 'tree_sha': tree['sha'], 'files': files, 'branch_updated': False, 'production_deployed': False}, indent=2))
          print('Test-only proposed commit:', commit['sha'])
          print('No refs, production services, or model approvals changed.')
      - uses: actions/upload-artifact@v4
        with:
          name: v7-test-repair-proposal
          path: /tmp/v7-test-repair/proposal.json
          retention-days: 1
          if-no-files-found: error
